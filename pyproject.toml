[project]
name = "towebp"
version = "1.1.0"
description = "Professional WEBP converter CLI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pillow",
    "rich",
    "rich-argparse"
]

[project.scripts]
towebp = "towebp.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"